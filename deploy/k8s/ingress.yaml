apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-web-app
  namespace: sample-web-app
  annotations:
    # Set to your ingress class (e.g. "alb" for AWS Load Balancer Controller, "nginx" for ingress-nginx)
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: sample-web-app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-web-app
                port:
                  number: 80
