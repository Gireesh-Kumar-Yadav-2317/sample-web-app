# Copy this file to secret.yaml, fill values, and apply.
# In a real setup these values should come from AWS Secrets Manager, External Secrets Operator, or similar — not committed to git.
apiVersion: v1
kind: Secret
metadata:
  name: sample-web-app-db
  namespace: sample-web-app
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.sample-web-app.svc.cluster.local:5432/sample"
  SPRING_DATASOURCE_USERNAME: "sample"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
