apiVersion: v1
kind: Service
metadata:
  name: sample-web-app
  namespace: sample-web-app
  labels:
    app.kubernetes.io/name: sample-web-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-web-app
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
