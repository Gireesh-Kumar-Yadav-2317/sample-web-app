
name: Sample Web App CI/CD

on:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sample-web-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    outputs:
      image_changed: ${{ steps.filter.outputs.image }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Detect changes that can affect the application image.
      # Tags and manual runs deliberately bypass this filter.
      - name: Detect image-related changes
        id: filter
        if: >-
          github.event_name != 'workflow_dispatch' &&
          !(github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v'))
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'src/**'
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'docker-compose.yaml'
              - 'application*.properties'
              - '.github/workflows/**'

      - name: Validate required configuration
        shell: bash
        env:
          JAVA_VERSION: ${{ vars.JAVA_VERSION }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          set -euo pipefail

          test -n "$JAVA_VERSION" || {
            echo "::error::Configure JAVA_VERSION in repository variables."
            exit 1
          }

          test -n "$APP_NAME" || {
            echo "::error::Configure APP_NAME in repository variables."
            exit 1
          }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Validate Docker Compose configuration
        shell: bash
        env:
          # Disposable CI-only values. No real database credentials.
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: ci_db
          DB_USER: ci_user
          DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          DB_NAME: ci_db
          APP_PORT: ${{ vars.APP_PORT || '8080' }}
        run: |
          set -euo pipefail
          docker compose config -q

      - name: Run Maven verification
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp verify

  image:
    name: Build, Scan and Publish Image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Build only when relevant files changed, on manual runs,
    # or for version tags.
    if: >-
      needs.test.result == 'success' &&
      (
        needs.test.outputs.image_changed == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      RELEASE_BRANCH: ${{ vars.RELEASE_BRANCH }}
      LOCAL_IMAGE: local/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: false
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keep the security gate enabled.
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.LOCAL_IMAGE }}
      #     format: table
      #     severity: CRITICAL,HIGH,MEDIUM
      #     ignore-unfixed: true
      #     exit-code: '1'

      # Publish only from the configured release branch or
      # a version tag. Pull requests and feature branches never publish.
      - name: Validate publishing configuration
        if: >-
          github.event_name == 'push' &&
          (
            github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH) ||
            startsWith(github.ref, 'refs/tags/v')
          )
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is not configured."
            exit 1
          }

          test -n "$DOCKERHUB_REPOSITORY" || {
            echo "::error::DOCKERHUB_REPOSITORY is not configured."
            exit 1
          }

          test -n "$RELEASE_BRANCH" || {
            echo "::error::RELEASE_BRANCH is not configured."
            exit 1
          }

          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN secret is not configured."
            exit 1
          }

      - name: Log in to Docker Hub
        if: >-
          github.event_name == 'push' &&
          (
            github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH) ||
            startsWith(github.ref, 'refs/tags/v')
          )
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish verified image
        if: >-
          github.event_name == 'push' &&
          (
            github.ref == format('refs/heads/{0}', vars.RELEASE_BRANCH) ||
            startsWith(github.ref, 'refs/tags/v')
          )
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}"

          # Publish the exact local image that passed the Trivy scan.
          docker tag "$LOCAL_IMAGE" "$IMAGE_REPO:sha-${GITHUB_SHA}"
          docker push "$IMAGE_REPO:sha-${GITHUB_SHA}"

          if [[ "$GITHUB_REF" == "refs/heads/${RELEASE_BRANCH}" ]]; then
            docker tag "$LOCAL_IMAGE" "$IMAGE_REPO:latest"
            docker push "$IMAGE_REPO:latest"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            docker tag "$LOCAL_IMAGE" "$IMAGE_REPO:${GITHUB_REF_NAME}"
            docker push "$IMAGE_REPO:${GITHUB_REF_NAME}"
          fi