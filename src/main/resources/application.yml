spring:
  application:
    name: sample-web-app
  datasource:
    url: jdbc:h2:mem:sample;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.onemoretechie.sample: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: '{"ts":"%d{ISO8601}","level":"%level","logger":"%logger","thread":"%thread","msg":"%replace(%msg){''"'',''\\"''}","trace":"%X{traceId:-}","span":"%X{spanId:-}"}%n'
